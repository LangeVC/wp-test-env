; WordPress Testing Environment PHP Configuration
; Enable all error reporting for development/testing
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /var/www/html/wp-content/debug.log

; Increase memory limits for testing
memory_limit = 512M
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 300
max_input_time = 300

; Enable OPCache for better performance (but keep validation for development)
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.revalidate_freq=0
opcache.fast_shutdown=1

; XDebug configuration (optional, can be enabled via environment variable)
[xdebug]
xdebug.mode = debug,develop
xdebug.start_with_request = yes
xdebug.client_port = 9003
xdebug.client_host = host.docker.internal
xdebug.log = /var/www/html/wp-content/xdebug.log
xdebug.log_level = 7