# WordPress Testing Environment — Plugin Configuration
# Declarative plugin management. The setup script reads this file and installs
# all declared plugins into the running WordPress container.
#
# Version: 2.0

# Default settings for all plugins
defaults:
  auto_activate: true
  source: wordpress.org
  install_priority: normal

# Plugin definitions
plugins:

  # — Dev & Debug Tools —
  - slug: query-monitor
    name: Query Monitor
    source: wordpress.org
    category: dev-tools

  - slug: debug-bar
    name: Debug Bar
    source: wordpress.org
    category: dev-tools

  - slug: user-switching
    name: User Switching
    source: wordpress.org
    category: dev-tools

  - slug: wordpress-importer
    name: WordPress Importer
    source: wordpress.org
    category: dev-tools

  # — Page Builders —
  # Elementor Free from wordpress.org
  - slug: elementor
    name: Elementor
    source: wordpress.org
    category: page-builder

  # Elementor Pro from local bundle
  - slug: elementor-pro
    name: Elementor Pro
    source: local
    zip_path: vendor-assets/elementor-pro.zip
    category: page-builder
    install_priority: late

  # Elementor Pro Activator
  - slug: elementor-pro-activator
    name: Elementor Pro Activator
    source: local
    zip_path: vendor-assets/elementor-pro-activator.zip
    category: page-builder
    install_priority: late

  # — JetEngine / Crocoblock —
  - slug: jet-engine
    name: JetEngine
    source: local
    zip_path: vendor-assets/jet-engine.zip
    category: elementor-addons
    install_priority: late

  - slug: crocoblock-activator
    name: Crocoblock Activator
    source: local
    zip_path: vendor-assets/crocoblock-activator.zip
    category: elementor-addons
    install_priority: late

  # — Elementor Addons —
  - slug: essential-addons-for-elementor-lite
    name: Essential Addons for Elementor
    source: wordpress.org
    category: elementor-addons

# ──────────────────────────────────────────────
# Bundle definitions (premium + activator combos)
# ──────────────────────────────────────────────
bundles:
  elementor-pro-bundle:
    description: "Elementor Pro with license bypass"
    plugins:
      - slug: elementor
        source: wordpress.org
        install_order: 1
      - slug: elementor-pro
        source: local
        zip_path: vendor-assets/elementor-pro.zip
        install_order: 2
      - slug: elementor-pro-activator
        source: local
        zip_path: vendor-assets/elementor-pro-activator.zip
        install_order: 3

  jet-engine-bundle:
    description: "Crocoblock JetEngine with license bypass"
    plugins:
      - slug: jet-engine
        source: local
        zip_path: vendor-assets/jet-engine.zip
        install_order: 1
      - slug: crocoblock-activator
        source: local
        zip_path: vendor-assets/crocoblock-activator.zip
        install_order: 2
