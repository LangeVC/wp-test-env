name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── GitHub Release Asset (ZIP) ──────────────────────────────────────────
  package-zip:
    # GitHub-only: never runs on the Forgejo mirror side.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      zip_name: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Create release package
        id: zip
        run: |
          ZIP="wp-test-env-${GITHUB_REF_NAME#v}.zip"
          echo "name=${ZIP}" >> $GITHUB_OUTPUT
          zip -r "${ZIP}" \
            docker-compose.yml \
            docker/ \
            config/ \
            scripts/ \
            tests/ \
            plugins/ \
            themes/ \
            .env.example \
            README.md \
            LICENSE \
            -x "*/.*" ".git/*"

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.name }}
          generate_release_notes: true

  # ── Docker Image Build & Push ───────────────────────────────────────────
  build-docker:
    # GitHub-only: never runs on the Forgejo mirror side.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/langevc/wp-test-env:latest
            ghcr.io/langevc/wp-test-env:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
